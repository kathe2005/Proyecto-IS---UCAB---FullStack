<div class="main-container">
  <div class="container-custom">
  
    <div class="header-section">
      <h1 class="page-title">Editar Incidencia</h1>
      <p class="page-subtitle">Sistema de Gestión - Universidad Católica Andrés Bello</p>
    </div>
    <div *ngIf="cargandoDatos" class="loading-container">
      <div class="spinner-border text-primary mb-3" role="status" style="width: 3rem; height: 3rem;">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <p class="h5 fw-normal">Recuperando información...</p>
    </div>
    <div *ngIf="!cargandoDatos">
      <div *ngIf="mensaje" [class]="'alert alert-' + mensajeTipo + ' mb-4'" role="alert">
        <i class="fas" [class]="{
          'fa-check-circle': mensajeTipo === 'success',
          'fa-exclamation-triangle': mensajeTipo === 'warning',
          'fa-times-circle': mensajeTipo === 'danger'
        }"></i>
        <div>{{ mensaje }}</div>
      </div>
      <div class="form-card">
        <div class="form-section-title">
          <div>
            <i class="fas fa-edit text-primary me-2"></i>
            <span>Detalles del Reporte</span>
          </div>
          <span class="ticket-id">Ticket #{{ idIncidencia }}</span>
        </div>
        <form (ngSubmit)="guardarCambios()" #formEditar="ngForm">
          <div class="row g-4">
            <div class="col-md-6">
              <label for="cliente" class="form-label">Cliente Afectado</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 rounded-start-3">
                  <i class="fas fa-user text-primary"></i>
                </span>
                <input type="text" 
                       class="form-control border-start-0 rounded-end-3" 
                       id="cliente"
                       [(ngModel)]="incidencia.clienteAfectado" 
                       name="clienteAfectado"
                       required>
              </div>
            </div>
            <div class="col-md-6">
              <label for="tipo" class="form-label">Tipo de Problema</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 rounded-start-3">
                  <i class="fas fa-list-ul text-primary"></i>
                </span>
                <select class="form-select border-start-0 rounded-end-3" 
                        id="tipo"
                        [(ngModel)]="incidencia.tipoProblema" 
                        name="tipoProblema"
                        required>
                  <option *ngFor="let tipo of tiposProblema" [value]="tipo.valor">
                    {{ tipo.etiqueta }}
                  </option>
                </select>
              </div>
            </div>
            <div class="col-12">
              <label for="estado" class="form-label">Estado Actual</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 rounded-start-3">
                  <i class="fas fa-tasks text-primary"></i>
                </span>
                <select class="form-select border-start-0 rounded-end-3" 
                        id="estado"
                        [(ngModel)]="incidencia.estado" 
                        name="estado"
                        [ngClass]="{
                          'text-warning fw-bold': incidencia.estado === 'NO_ATENDIDA',
                          'text-success fw-bold': incidencia.estado === 'ATENDIDA',
                          'text-secondary fw-bold': incidencia.estado === 'CANCELADA'
                        }"
                        required>
                  <option *ngFor="let est of estados" [value]="est.valor">
                    {{ est.etiqueta }}
                  </option>
                </select>
              </div>
              <div class="form-text">Actualice el estado si el problema ha sido resuelto.</div>
            </div>
            <div class="col-12">
              <label for="descripcion" class="form-label">Descripción</label>
              <textarea class="form-control" 
                        id="descripcion"
                        rows="5" 
                        [(ngModel)]="incidencia.descripcion" 
                        name="descripcion"
                        required></textarea>
            </div>
          </div>
          <div class="form-actions">
            <button type="button" (click)="volver()" class="btn-custom btn-secondary-ucab">
              <i class="fas fa-times"></i> Cancelar
            </button>
            <button type="submit" class="btn-custom btn-primary-ucab" [disabled]="procesando">
              <i class="fas" [class]="procesando ? 'fa-spinner fa-spin' : 'fa-save'"></i>
              {{ procesando ? 'Guardando...' : 'Guardar Cambios' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <footer class="footer">
    © 2026 UCAB Montalbán - Sistema de Gestión de Estacionamiento
  </footer>
</div>
